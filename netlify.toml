[build]
  functions = "netlify/functions"
  publish = "."

# QA 19 Oct 2026 (route fix): Netlify "Pretty URLs" post-processing rewrote every
# relative link in the served HTML against the files' real folder, so
# href="stories.html" was published as href='/test5/stories' on /hikaya/ pages.
# Keep it off: relative links then resolve inside /hikaya/.
[build.processing.html]
  pretty_urls = false

[functions."send-abandoned-reminders"]
  schedule = "0 */6 * * *"

# Daily 08:00 UAE (04:00 UTC): customer feedback requests + team "needs attention" summary.
[functions."daily-emails"]
  schedule = "0 4 * * *"

# Tabby safety net: captures approved payments whose customer closed the tab before returning.
[functions."tabby-sweep"]
  schedule = "17 * * * *"

# Deletes uploaded child photos older than 15 days (our promise to parents).
[functions."purge-child-photos"]
  schedule = "30 2 * * *"

# ============================ LAUNCH SWITCH ============================
# Soft launch: the shop is public at /hikaya/ but kept out of Google until the
# 1 Nov 2026 launch. These two header blocks are the ONLY thing keeping the
# public /hikaya/ pages out of search (the page HTML no longer carries its own
# noindex). To go live in search: delete the two blocks below, deploy, then
# check https://maison-jaber.com/hikaya/ no longer returns X-Robots-Tag.
# Private pages (cart, checkout, account, admin, personalise...) keep their own
# <meta name="robots" content="noindex"> and robots.txt rules after launch.
[[headers]]
  for = "/hikaya/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
# ========================== END LAUNCH SWITCH ===========================
[[headers]]
  for = "/test/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/test2/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/test3/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/test4/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Old fixed story pages (stale titles and EUR prices) now point to the live story page.

[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "text/plain"

[[redirects]]
  from = "https://www.maison-jaber.com/.well-known/apple-developer-merchantid-domain-association"
  to = "/.well-known/apple-developer-merchantid-domain-association"
  status = 200
  force = true

# Soft launch: maison-jaber.com/hikaya/ serves the shop (files live in /hikaya/).
[[redirects]]
  from = "/hikaya/story-bravest-little-one.html"
  to = "/hikaya/story.html?s=door-of-a-thousand-stars"
  status = 301
  force = true
[[redirects]]
  from = "/hikaya/story-cloud-ship.html"
  to = "/hikaya/story.html?s=why-is-baby-looking-at-me"
  status = 301
  force = true
[[redirects]]
  from = "/hikaya/story-star-who-couldnt-sleep.html"
  to = "/hikaya/story.html?s=to-the-rescue"
  status = 301
  force = true
# /test5/ was the staging copy; it is retired (22 Oct 2026) and the files now live in /hikaya/.
# Old /test5/ links (emails, bookmarks, ads) go to the same page on /hikaya/.
[[redirects]]
  from = "/test5"
  to = "/hikaya/"
  status = 301
  force = true
[[redirects]]
  from = "/test5/*"
  to = "/hikaya/:splat"
  status = 301
  force = true

[build]
  functions = "netlify/functions"
  publish = "."

# The Google Maps key in hikaya/checkout.html is a public browser key (locked to
# maison-jaber.com in Google Cloud), so Netlify's secret scanner may skip that one value.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyC6ymgwcYmY3tEIcH44IZSkuroZ2epqM3I"

# QA 19 Oct 2026 (route fix): Netlify "Pretty URLs" post-processing rewrote every
# relative link in the served HTML against the files' real folder, so
# href="stories.html" was published as href='/test5/stories' on /hikaya/ pages.
# Keep it off: relative links then resolve inside /hikaya/.
[build.processing.html]
  pretty_urls = false

# Saved-order reminder: hourly, so the one opt-in reminder lands ~3-4h after the shopper left.
# Sends nothing unless the env var CART_REMINDERS_LIVE = 1 (dry-run otherwise).
[functions."send-abandoned-reminders"]
  schedule = "15 * * * *"

# Daily 08:00 UAE (04:00 UTC): customer feedback requests + team "needs attention" summary.
[functions."daily-emails"]
  schedule = "0 4 * * *"

# Owner-only WhatsApp alerts (Nov 2026): stuck at payment, checkout without an order, and the
# add-to-cart summary at 10:00 / 13:00 / 16:00 / 19:00 / 22:00 UAE. Only ever messages OWNER_WHATSAPP.
[functions."owner-alerts"]
  schedule = "*/5 * * * *"

# Tabby safety net: captures approved payments whose customer closed the tab before returning.
[functions."tabby-sweep"]
  schedule = "17 * * * *"

# Tamara safety net: authorises approved orders whose customer closed the tab before returning.
[functions."tamara-sweep"]
  schedule = "41 * * * *"

# Google Ads offline conversions for confirmed paid orders (Data Manager API). Idempotent; dry run
# unless GADS_UPLOADS_LIVE = 1; does nothing until the Google credentials are set.
[functions."gads-conversions"]
  schedule = "37 * * * *"

# Deletes uploaded child photos older than 15 days (our promise to parents).
[functions."purge-child-photos"]
  schedule = "30 2 * * *"

# Free AI cover preview: deletes the child's photo, illustration and preview within 48 hours.
[functions."purge-cover-previews"]
  schedule = "23 * * * *"

# Daily 06:00 UAE (02:00 UTC): report of the last 24 hours of cover previews, with the generated covers.
[functions."cover-preview-report"]
  schedule = "0 2 * * *"

# Speed (Nov 2026): let browsers and Netlify's CDN reuse shop images instead of
# re-checking them on every page view. One day fresh, then up to a week served
# from cache while the new copy is fetched, so a replaced image shows within a day.
[[headers]]
  for = "/hikaya/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/story-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
# Private pages (Nov 2026): never in search results. Header + the page's own <meta name="robots">; these pages are
# deliberately NOT blocked in robots.txt (except admin) so Google can see the noindex. Includes the free cover
# preview flow (cover-preview.html), whose child name / photo / preview must never be indexed.
[[headers]]
  for = "/hikaya/cover-preview.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/personalize.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/cart.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/checkout.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/book-added.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/account.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/login.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/invoice.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/track-order.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/search.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/feedback.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/hikaya/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/test/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/test2/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/test3/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/test4/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Old fixed story pages (stale titles and EUR prices) now point to the live story page.

[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "text/plain"

[[redirects]]
  from = "https://www.maison-jaber.com/.well-known/apple-developer-merchantid-domain-association"
  to = "/.well-known/apple-developer-merchantid-domain-association"
  status = 200
  force = true

# Printed QR codes on the Hikaya gift boxes (Nov 2026) point to maison-jaber.com/contact.
# Send them permanently to the shop. Applies to www and non-www (both serve this site);
# the real contact page at /hikaya/contact.html is unaffected. Do not remove.
[[redirects]]
  from = "/contact"
  to = "/hikaya/"
  status = 301
  force = true
[[redirects]]
  from = "/contact.html"
  to = "/hikaya/"
  status = 301
  force = true

# Server code and database scripts kept in the repo (supabase/) are not part of the website (Nov 2026).
[[redirects]]
  from = "/supabase/*"
  to = "/hikaya/404.html"
  status = 404
  force = true

# Internal SEO generator scripts (tools/seo/) are not part of the website.
[[redirects]]
  from = "/tools/*"
  to = "/hikaya/404.html"
  status = 404
  force = true

# Short tracked links made in the dashboard (Customers tab > Link maker): maison-jaber.com/go/eid-reel
[[redirects]]
  from = "/go/*"
  to = "/.netlify/functions/go?c=:splat"
  status = 200
  force = true

# maison-jaber.com/hikaya/ serves the shop (files live in /hikaya/).
[[redirects]]
  from = "/hikaya/story-bravest-little-one.html"
  to = "/hikaya/story.html?s=door-of-a-thousand-stars"
  status = 301
  force = true
[[redirects]]
  from = "/hikaya/story-cloud-ship.html"
  to = "/hikaya/story.html?s=why-is-baby-looking-at-me"
  status = 301
  force = true
[[redirects]]
  from = "/hikaya/story-star-who-couldnt-sleep.html"
  to = "/hikaya/story.html?s=to-the-rescue"
  status = 301
  force = true
# /test5/ was the staging copy; it is retired (22 Oct 2026) and the files now live in /hikaya/.
# Old /test5/ links (emails, bookmarks, ads) go to the same page on /hikaya/.
[[redirects]]
  from = "/test5"
  to = "/hikaya/"
  status = 301
  force = true
[[redirects]]
  from = "/test5/*"
  to = "/hikaya/:splat"
  status = 301
  force = true

# Unknown shop addresses get Hikaya's own "page not found" page with a real 404 status
# (Netlify only uses this when no file matches, so every real page is unaffected).
# Keep this rule LAST.
[[redirects]]
  from = "/hikaya/*"
  to = "/hikaya/404.html"
  status = 404

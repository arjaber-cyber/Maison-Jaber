<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ziina test · Maison Jaber</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600;700&display=swap");
:root{--ink:#2E2018;--ink-soft:#7d6a5a;--line:#DFC9AE;--coral:#A67443;--coral-deep:#563622;--bg:#F8F2E8;--bg-soft:#F3E8D8;--gold:#C8954D;--ok:#3f7a4a;--bad:#B5563B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;line-height:1.6}
main{max-width:560px;margin:48px auto;padding:0 20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:34px;margin:6px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{flex:1;padding:14px 20px;border-radius:16px;border:none;font:700 14px Inter,sans-serif;cursor:pointer;background:var(--coral);color:#fff}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:15px Inter,sans-serif;margin:8px 0 12px}
.muted{color:var(--ink-soft);font-size:14px}
.msg{margin-top:14px;font-size:14px;white-space:pre-wrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}
iframe{width:100%;max-width:450px;height:820px;border:0;display:block;margin:18px auto 0}
</style>
</head><body><main>
<div class="eyebrow">Hikaya by Maison Jaber</div>
<h1>Ziina payment test</h1>
<p class="muted">Fixed amount: <b>2.00 AED</b>. Test mode moves no money (any card number works). Live mode charges your real card 2 AED.</p>
<div class="card">
  <div class="row">
    <button onclick="pay('test')">Test payment (no charge)</button>
    <button class="alt" onclick="pay('live')">Live payment · 2 AED</button>
  </div>
  <label class="muted" style="display:block;margin-top:14px"><input type="checkbox" id="hosted" style="width:auto;margin:0 6px 0 0">Use Ziina's hosted page instead of paying on this page</label>
  <div id="msg" class="msg"></div>
</div>
<div id="frameWrap"></div>
<script>
async function pay(mode){
  if(mode==='live' && !confirm('This will charge 2 AED to a real card. Continue?')) return;
  const btns=document.querySelectorAll('button'); btns.forEach(b=>b.disabled=true);
  const msg=document.getElementById('msg'); msg.className='msg'; msg.textContent='Creating payment…';
  try{
    const r=await fetch('/.netlify/functions/ziina-test-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode})});
    const d=await r.json();
    if(!r.ok) throw new Error((d.error||'Error')+(d.detail?'\n'+JSON.stringify(d.detail):''));
    const useHosted=document.getElementById('hosted').checked || !d.embeddedUrl;
    if(useHosted){ location.href=d.redirectUrl; return; }
    msg.textContent=(mode==='test'?'TEST mode':'LIVE mode')+' · pay below';
    const sep=d.embeddedUrl.includes('?')?'&':'?';
    document.getElementById('frameWrap').innerHTML='<iframe allow="payment" src="'+d.embeddedUrl+sep+'version=v1"></iframe>';
  }catch(e){ msg.className='msg bad'; msg.textContent=e.message; btns.forEach(b=>b.disabled=false); }
}
</script>
</main></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Hikaya by Maison Jaber</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --ink: #2E2018; --ink-soft: #7d6a5a; --line: #DFC9AE; --line-soft: #ece1d1;
    --coral: #A67443; --coral-deep: #563622; --bg: #F8F2E8; --bg-soft: #F3E8D8;
    --radius: 16px; --radius-lg: 24px;
    /* legacy aliases so existing component CSS re-themes automatically */
    --charcoal: var(--ink); --ivory: var(--bg); --gold: #C8954D; --champagne: var(--coral-deep);
    --indigo: var(--ink); --lavender: var(--ink-soft); --rose: var(--coral); --sage: var(--ink-soft);
    --taupe: var(--line); --parchment: var(--bg-soft);
    --text-on-light: var(--ink); --text-on-light-soft: var(--ink-soft);
    --text-on-dark: #ffffff; --text-on-dark-soft: #f1e9dc;
    --sunshine: #C08A3E; --sky: #7d6a5a; --terracotta: #B5563B; --brown: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 15px; }
  h1, h2 { font-family: 'Inter', sans-serif; font-weight: 600; margin: 0; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  header.site { border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--bg); z-index: 50; padding: 18px 0; }
  header.site .inner { display: flex; align-items: center; justify-content: space-between; }
  .wordmark { font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 700; color: var(--coral-deep); }
  header.site a.exit { font-size: 13px; font-weight: 700; color: var(--ink-soft); }

  .page-head { padding: 20px 0; }
  .page-head h1 { font-size: 26px; }
  .page-head p { color: var(--ink-soft); font-weight: 600; margin-top: 6px; }

  .state-box { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-weight: 700; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 800px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
  .stat-card { background: #fff; border-radius: var(--radius); padding: 18px 20px; }
  .stat-card .num { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 600; color: var(--coral-deep); line-height: 1; }
  .stat-card .lbl { font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-top: 6px; }
  .stat-card.wide { grid-column: span 2; }
  @media (max-width: 800px) { .stat-card.wide { grid-column: span 2; } }
  .stage-breakdown { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .stage-breakdown .row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .stage-breakdown .row .name { width: 92px; flex-shrink: 0; color: var(--ink-soft); font-weight: 700; }
  .stage-breakdown .bar-track { flex: 1; height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
  .stage-breakdown .bar-fill { height: 100%; background: var(--coral); border-radius: 3px; }
  .stage-breakdown .count { width: 18px; text-align: right; font-weight: 700; color: var(--ink); }

  .req-card {
    background: #fff; border-radius: var(--radius); padding: 20px 22px; margin-bottom: 14px;
  }
  .req-top { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; margin-bottom: 14px; }
  @media (max-width: 700px) { .req-top { grid-template-columns: 1fr; } }
  .req-photos { display: flex; gap: 6px; }
  .req-photos .ph { width: 48px; height: 48px; border-radius: 10px; background: var(--line); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--ink-soft); }
  .req-info h3 { font-size: 16px; margin-bottom: 4px; }
  .req-info .meta { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .req-info .dedication { font-size: 12px; color: var(--ink-soft); font-style: italic; margin-top: 6px; }
  .req-date { font-size: 12px; color: var(--ink-soft); font-weight: 700; white-space: nowrap; }

  .pipeline { display: flex; gap: 4px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
  .stage-btn {
    flex: 1; min-width: 90px; font-size: 10.5px; font-weight: 800; text-align: center; padding: 9px 6px;
    border-radius: 10px; border: 2px solid var(--line); background: var(--cream); color: var(--ink-soft);
    cursor: pointer; font-family: 'Inter', sans-serif; line-height: 1.3;
  }
  .stage-btn.done { background: var(--sage); border-color: var(--sage); color: #fff; }
  .stage-btn.current { border-color: var(--coral); color: var(--coral-deep); background: #fff; }
  .stage-status-note { font-size: 11px; color: var(--ink-soft); margin-top: 8px; min-height: 14px; }


  footer.site { padding: 30px 0; text-align: center; }
  footer.site p { font-size: 12px; color: var(--ink-soft); font-weight: 600; }

  .site-logo { height: 88px; width: auto; display: block; }

  .lang-pill { font-size: 13px; font-weight: 700; padding: 10px 12px; border-radius: 100px; cursor: pointer; }
  .lang-pill:hover { background: var(--bg-soft, #f7f7f7); }
</style>
<script src="/i18n.js" defer></script>
<link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<header class="site">
  <div class="wrap inner">
    <div class="wordmark" style="display:flex; align-items:center; gap:10px;"><img src="images/logo-hikaya.png" alt="Hikaya by Maison Jaber" class="site-logo" style="height:42px;"><span style="font-size:13px; font-weight:700; color:var(--ink-soft); border-left:1px solid var(--line); padding-left:10px;" data-i18n="admin.dashboard_label">Dashboard</span></div>
    <a class="lang-pill" href="#" data-i18n-skip style="margin-right:8px;">EN</a><a class="exit" href="index.html" data-i18n="admin.back_to_site">&larr; Back to site</a>
  </div>
</header>

<div class="wrap page-head">
  <h1 data-i18n="admin.incoming_requests">Incoming requests</h1>
  <p id="page-sub" data-i18n="admin.loading">Loading...</p>
</div>

<div class="wrap" id="stats-row" style="display:none; margin-bottom: 24px;"></div>

<div class="wrap" id="content">
  <div class="state-box" id="state-box" data-i18n="admin.checking_access">Checking your access…</div>
</div>

<footer class="site"><div class="wrap"><p data-i18n="admin.footer">&copy; 2026 Maison Jaber. Admin dashboard.</p></div></footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const supabase = createClient(
    'https://zxzlarlpoctpnnnvzced.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4emxhcmxwb2N0cG5ubnZ6Y2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTIwODUsImV4cCI6MjEwNDAyODA4NX0.NURv-OB9GIU23fsMAlsMFD59oxuKqc1hDHNuoUHQ21E'
  );

  const stateBox = document.getElementById('state-box');
  const pageSub = document.getElementById('page-sub');

  const STAGES = [
    { key: 'received', label: window.hikayaT('admin.stage_received') },
    { key: 'preparing', label: window.hikayaT('admin.stage_preparing') },
    { key: 'awaiting_approval', label: window.hikayaT('admin.stage_approval') },
    { key: 'sent_to_printing', label: window.hikayaT('admin.stage_printing') },
    { key: 'received_from_printing', label: window.hikayaT('admin.stage_from_printing') },
    { key: 'shipped', label: window.hikayaT('admin.stage_shipped') },
    { key: 'delivered', label: window.hikayaT('admin.stage_delivered') }
  ];

  const BOOK_PRICE = 35;

  function renderStats(submissions) {
    const statsRow = document.getElementById('stats-row');
    const now = new Date();
    const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);

    const total = submissions.length;
    const thisWeek = submissions.filter(s => new Date(s.created_at) >= weekAgo).length;
    const estRevenue = total * BOOK_PRICE;

    // Most-requested story
    const storyCounts = {};
    submissions.forEach(s => {
      const story = (s.data || {}).story || 'Unknown';
      storyCounts[story] = (storyCounts[story] || 0) + 1;
    });
    const topStory = Object.entries(storyCounts).sort((a, b) => b[1] - a[1])[0];

    // Breakdown by stage
    const stageCounts = {};
    STAGES.forEach(s => { stageCounts[s.key] = 0; });
    submissions.forEach(s => {
      const key = STAGES.some(st => st.key === s.status) ? s.status : 'received';
      stageCounts[key] = (stageCounts[key] || 0) + 1;
    });
    const maxStageCount = Math.max(...Object.values(stageCounts), 1);

    statsRow.style.display = 'grid';
    statsRow.className = 'stats-grid';
    statsRow.innerHTML = `
      <div class="stat-card">
        <div class="num">${total}</div>
        <div class="lbl">Total Requests</div>
      </div>
      <div class="stat-card">
        <div class="num">${thisWeek}</div>
        <div class="lbl">This Week</div>
      </div>
      <div class="stat-card">
        <div class="num">€${estRevenue.toLocaleString()}</div>
        <div class="lbl">Estimated Value</div>
      </div>
      <div class="stat-card">
        <div class="num" style="font-size:20px; line-height:1.3;">${topStory ? topStory[0] : '—'}</div>
        <div class="lbl">Most Requested (${topStory ? topStory[1] : 0})</div>
      </div>
      <div class="stat-card wide">
        <div class="lbl" style="margin-bottom:10px;">Orders by Stage</div>
        <div class="stage-breakdown">
          ${STAGES.map(s => `
            <div class="row">
              <div class="name">${s.label}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${(stageCounts[s.key] / maxStageCount) * 100}%"></div></div>
              <div class="count">${stageCounts[s.key]}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }



  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
  } else {
    accessToken = session.access_token;
    loadSubmissions(accessToken);
  }

  async function loadSubmissions(token) {
    try {
      const res = await fetch('/.netlify/functions/get-submissions', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data = await res.json();

      if (!res.ok) {
        pageSub.textContent = '';
        stateBox.textContent = data.error || window.hikayaT('admin.err_load');
        return;
      }

      const submissions = data.submissions || [];
      pageSub.textContent = `${submissions.length} ${window.hikayaT('admin.requests_received')}`;

      if (submissions.length === 0) {
        stateBox.textContent = window.hikayaT('admin.no_requests');
        return;
      }

      renderStats(submissions);

      stateBox.remove();
      const content = document.getElementById('content');
      submissions
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        .forEach(sub => {
          const d = sub.data || {};
          const photoKeys = Object.keys(d).filter(k => k.startsWith('photo_'));
          const currentIndex = STAGES.findIndex(s => s.key === sub.status);

          const card = document.createElement('div');
          card.className = 'req-card';
          card.innerHTML = `
            <div class="req-top">
              <div class="req-photos">
                ${photoKeys.length ? photoKeys.map(() => `<div class="ph">${window.hikayaT('admin.photo')}</div>`).join('') : '<div class="ph"></div>'}
              </div>
              <div class="req-info">
                <h3>${d.child_name || window.hikayaT('admin.unnamed')} &middot; ${d.story || window.hikayaT('admin.no_story')}</h3>
                <div class="meta">${window.hikayaT('admin.ages_label')} ${d.age_edition || '—'} &middot; ${d.account_email || d.parent_email || window.hikayaT('admin.no_email')}</div>
                ${d.dedication ? `<div class="dedication">"${d.dedication}"</div>` : ''}
              </div>
              <div class="req-date">${new Date(sub.created_at).toLocaleDateString()}</div>
            </div>
            <div class="pipeline">
              ${STAGES.map((stage, i) => `
                <button type="button" class="stage-btn ${i < currentIndex ? 'done' : ''} ${i === currentIndex ? 'current' : ''}" data-key="${stage.key}">${stage.label}</button>
              `).join('')}
            </div>
            <div class="stage-status-note"></div>
          `;

          card.querySelectorAll('.stage-btn').forEach(btn => {
            btn.addEventListener('click', () => updateStage(sub.id, btn.dataset.key, card));
          });

          content.appendChild(card);
        });
    } catch (err) {
      pageSub.textContent = '';
      stateBox.textContent = window.hikayaT('admin.err_generic');
    }
  }

  async function updateStage(submissionId, status, card) {
    const note = card.querySelector('.stage-status-note');
    note.textContent = window.hikayaT('admin.saving');
    try {
      const res = await fetch('/.netlify/functions/update-order-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
        body: JSON.stringify({ submissionId: String(submissionId), status })
      });
      const data = await res.json();
      if (!res.ok) {
        note.textContent = data.error || window.hikayaT('admin.err_save');
        return;
      }
      note.textContent = window.hikayaT('admin.saved');
      const currentIndex = STAGES.findIndex(s => s.key === status);
      card.querySelectorAll('.stage-btn').forEach((btn, i) => {
        btn.classList.toggle('done', i < currentIndex);
        btn.classList.toggle('current', i === currentIndex);
      });
      setTimeout(() => { note.textContent = ''; }, 2000);
    } catch {
      note.textContent = window.hikayaT('admin.err_save_generic');
    }
  }
</script>

</body>
</html>

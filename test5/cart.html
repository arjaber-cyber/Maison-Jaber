<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — Hikaya by Maison Jaber</title>
<meta name="description" content="Review the personalized storybooks in your cart before checkout." />
<meta name="robots" content="noindex, follow" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --ink: #2E2018; --ink-soft: #7d6a5a; --line: #DFC9AE; --line-soft: #ece1d1;
    --coral: #A67443; --coral-deep: #563622; --bg: #F8F2E8; --bg-soft: #F3E8D8;
    --radius: 16px; --radius-lg: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; }
  h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 600; margin: 0; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 640px) { .wrap { padding: 0 20px; } }

  header.site { border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--bg); z-index: 50; }
  header.site .inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  header.site .site-logo { height: 60px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .lang-pill, .zone-pill { font-size: 12.5px; font-weight: 700; padding: 9px 12px; border-radius: 100px; cursor: pointer; }
  .zone-pill { border: 1px solid var(--line-soft); }
  .lang-pill:hover, .zone-pill:hover { background: var(--bg-soft); }

  .page-head { padding: 36px 0 8px; }
  .page-head h1 { font-size: 30px; }
  .page-head p { color: var(--ink-soft); font-weight: 600; font-size: 14px; margin-top: 6px; }

  .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 32px; padding: 24px 0 80px; align-items: start; }
  @media (max-width: 860px) { .cart-layout { grid-template-columns: 1fr; } }

  .cart-item {
    display: flex; gap: 16px; background: #fff; border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
    box-shadow: 0 6px 18px rgba(50,44,36,0.06); align-items: center;
  }
  .cart-item .cover { width: 76px; height: 76px; border-radius: 10px; flex-shrink: 0; overflow: hidden; background: linear-gradient(165deg, #D98868 0%, #B5563B 100%); }
  .cart-item .cover.courage { background: linear-gradient(165deg, #D98868 0%, #B5563B 100%); }
  .cart-item .cover.adventure { background: linear-gradient(165deg, #DEB06B 0%, #C08A3E 100%); }
  .cart-item .cover.lullaby { background: linear-gradient(165deg, #a9829a 0%, #7d5a6b 100%); }
  .cart-item .info { flex: 1; min-width: 0; }
  .cart-item .info h3 { font-size: 17px; margin-bottom: 4px; }
  .cart-item .info .meta { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .cart-item .price { font-weight: 800; font-size: 15px; white-space: nowrap; text-align: end; }
  .cart-item .price .hk-was { display: block; font-size: 12.5px; }
  .cart-item .remove-btn {
    background: none; border: none; cursor: pointer; color: var(--ink-soft); font-size: 12px; font-weight: 700;
    text-decoration: underline; margin-top: 6px; padding: 0;
  }

  .upsell-banner {
    background: linear-gradient(135deg, #F3E8D8, #EADBC4); border-radius: var(--radius); padding: 16px 20px;
    margin-bottom: 18px; display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 700; color: var(--coral-deep);
  }
  .upsell-banner svg { width: 22px; height: 22px; stroke: var(--coral-deep); fill: none; flex-shrink: 0; }
  .upsell-banner.maxed { background: linear-gradient(135deg, #e7dcc0, #dcc99e); }

  .empty-cart { text-align: center; padding: 70px 20px; background: #fff; border-radius: var(--radius-lg); }
  .empty-cart svg { width: 52px; height: 52px; stroke: var(--line); fill: none; margin-bottom: 16px; }
  .empty-cart h2 { font-size: 22px; margin-bottom: 8px; }
  .empty-cart p { color: var(--ink-soft); font-weight: 600; margin-bottom: 22px; }

  .summary-box { background: #fff; border-radius: var(--radius); padding: 22px; position: sticky; top: 90px; }
  .summary-box h3 { font-size: 17px; margin-bottom: 14px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
  .summary-row.total { border-bottom: none; padding-top: 12px; }
  .summary-row.total span:first-child { font-weight: 800; }
  .summary-row.total span:last-child { color: var(--coral-deep); font-weight: 800; font-size: 16px; }
  .summary-row span:last-child { color: var(--ink-soft); font-weight: 700; }

  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px;
    border-radius: 999px; border: none; background: var(--coral); color: #fff; font-size: 14.5px; font-weight: 700;
    cursor: pointer; box-shadow: 0 12px 28px rgba(70,45,25,0.16); margin-top: 16px;
  }
  .btn-primary:hover { background: var(--coral-deep); }
  .continue-shopping { display: block; text-align: center; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .continue-shopping:hover { color: var(--coral-deep); }

  footer.site { background: #2E2018; color: #e8ddd0; padding: 30px 0; text-align: center; margin-top: 40px; }
  footer.site p { font-size: 12.5px; }

  /* ---- Cart v2 (Oct 2026): bundle progress, trust strip, promo ---- */
  .keep-browsing { display: inline-block; font-size: 14px; font-weight: 600; color: var(--ink-soft); margin-bottom: 10px; }
  .keep-browsing:hover { color: var(--brand, #8A5638); }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .page-head h1 { font-size: clamp(30px, 4vw, 40px); }
  .page-head .head-row p { margin: 0 0 6px; font-weight: 500; }
  .cart-layout { grid-template-columns: 1fr 360px; padding-bottom: 24px; }
  .sib-wrap { padding-bottom: 72px; }
  .sib-wrap .sibling { margin-top: 0; }
  @media (max-width: 860px) { .cart-layout { grid-template-columns: 1fr; } }

  .hk-progress { display: flex; gap: 16px; align-items: flex-start; background: linear-gradient(135deg, #FBF4E6, #F3E6CF); border: 1px solid rgba(199,165,108,.45); border-radius: 22px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 10px 30px -18px rgba(138,86,56,.35); }
  .hk-progress.maxed { align-items: center; }
  .hk-progress-ic { width: 44px; height: 44px; flex: none; border-radius: 50%; background: rgba(199,165,108,.22); display: grid; place-items: center; }
  .hk-progress-ic svg, .hk-trust svg, .hk-add-more svg, .summary-box h3 svg, .hk-saving svg, .hk-promo svg, .hk-checkout svg, .hk-secure svg, .chip svg, .remove-btn svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .hk-progress-ic svg { width: 22px; height: 22px; color: var(--brand, #8A5638); }
  .hk-progress-body { flex: 1; min-width: 0; }
  .hk-progress h2 { font-family: var(--sans, 'Manrope', sans-serif); font-size: 17px; font-weight: 800; color: var(--ink); margin: 0; }
  .hk-progress h2 em { font-style: normal; color: var(--gold, #C7A56C); }
  .hk-progress p { margin: 2px 0 0; font-size: 14px; color: var(--ink-soft); }
  .hk-bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.85); margin: 14px 0 8px; overflow: hidden; }
  .hk-bar span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #E2C17F, var(--gold, #C7A56C) 60%, var(--brand, #8A5638)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .hk-bar-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .hk-bar-labels .on { color: var(--gold, #C7A56C); }

  .cart-item { border-radius: 22px; padding: 20px; gap: 18px; border: 1px solid rgba(216,197,179,.55); background: var(--white, #FFFCF7); }
  .cart-item.leaving { opacity: 0; transform: translateX(-16px) scale(.98); transition: opacity .25s, transform .25s; }
  .cart-item .cover { width: 108px; height: 108px; border-radius: 16px; }
  .cart-item .info h3 { font-family: var(--sans, 'Manrope', sans-serif); font-size: 17px; font-weight: 800; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 99px; background: var(--card, #F3EADF); color: var(--ink-soft); }
  .chip.name { background: rgba(199,165,108,.2); color: var(--ink); }
  .chip.name svg { width: 12px; height: 12px; color: var(--brand, #8A5638); }
  .chip.extra { color: var(--brand, #8A5638); }
  .price-col { display: flex; align-items: center; gap: 14px; flex: none; }
  .cart-item .price { font-size: 17px; font-weight: 800; text-align: end; }
  .cart-item .price .hk-was { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .cart-item .remove-btn { width: 36px; height: 36px; border-radius: 50%; margin: 0; display: grid; place-items: center; text-decoration: none; transition: background .2s, color .2s; }
  .cart-item .remove-btn svg { width: 19px; height: 19px; }
  .cart-item .remove-btn:hover { background: #F6E3DA; color: #9A3F22; }
  @media (max-width: 560px) {
    .cart-item { flex-wrap: wrap; align-items: flex-start; }
    .cart-item .cover { width: 84px; height: 84px; }
    .cart-item .info { flex: 1 1 calc(100% - 110px); }
    .price-col { width: 100%; justify-content: space-between; padding-top: 10px; border-top: 1px dashed var(--line-soft); }
  }

  .hk-add-more { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; border-radius: 22px; border: 1.5px dashed rgba(199,165,108,.7); background: rgba(251,244,230,.6); color: var(--brand, #8A5638); font-weight: 700; font-size: 15.5px; margin: 4px 0 18px; transition: background .2s, border-color .2s, transform .2s; }
  .hk-add-more svg { width: 18px; height: 18px; }
  .hk-add-more:hover { background: #FBF4E6; border-color: var(--gold, #C7A56C); }
  .hk-trust { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .hk-trust > div { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 16px 10px; border-radius: 22px; border: 1px solid rgba(216,197,179,.55); background: var(--white, #FFFCF7); font-size: 13.5px; font-weight: 600; }
  .hk-trust svg { width: 22px; height: 22px; color: var(--gold, #C7A56C); }
  @media (max-width: 480px) { .hk-trust { gap: 8px; } .hk-trust > div { font-size: 12px; padding: 12px 6px; } }

  .summary-box { border-radius: 26px; padding: 26px; border: 1px solid rgba(216,197,179,.55); background: var(--white, #FFFCF7); box-shadow: 0 14px 34px -22px rgba(38,28,23,.3); }
  .summary-box h3 { display: flex; align-items: center; gap: 8px; font-family: var(--sans, 'Manrope', sans-serif); font-size: 18px; font-weight: 800; margin-bottom: 18px; }
  .summary-box h3 svg { width: 20px; height: 20px; color: var(--gold, #C7A56C); }
  .srow { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; padding: 6px 0; color: var(--ink-soft); }
  .srow.gold { color: var(--gold, #B8924F); }
  .srow.gold b { font-weight: 700; letter-spacing: .02em; }
  .srow.total { border-top: 1px solid var(--line-soft); margin-top: 8px; padding-top: 14px; color: var(--ink); font-size: 16px; }
  .srow.total bdi { font-weight: 800; font-size: 19px; }
  .hk-saving, .hk-promo { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 16px; border-radius: 16px; font-size: 14px; font-weight: 600; }
  .hk-saving { background: #FBF4E6; color: #A07A3A; border: 1px solid rgba(199,165,108,.35); }
  .hk-saving svg, .hk-promo svg { width: 18px; height: 18px; flex: none; }
  .hk-promo { display: block; background: #FFFAF0; border: 1px solid rgba(199,165,108,.35); color: var(--ink); }
  .hk-promo summary { display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; }
  .hk-promo summary::-webkit-details-marker { display: none; }
  .hk-promo summary svg { color: var(--gold, #C7A56C); }
  .hk-promo-form { display: flex; gap: 8px; margin-top: 12px; }
  .hk-promo-form input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 14px; text-transform: uppercase; }
  .hk-promo-form input:focus { outline: none; border-color: var(--gold, #C7A56C); }
  .hk-promo-form button { padding: 0 16px; border-radius: 12px; border: none; background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; }
  .hk-promo-form button:disabled { opacity: .6; }
  .hk-promo-msg { margin: 6px 0 0; font-size: 12.5px; min-height: 0; }
  .hk-promo-msg.error { color: #9A3F22; }
  .hk-promo.applied { display: flex; color: #3d5a26; background: #F1F5EA; border-color: #cfdcbc; }
  .hk-promo.applied span { flex: 1; }
  .hk-promo.applied button { background: none; border: none; text-decoration: underline; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink-soft); }
  .hk-checkout { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; padding: 18px; border-radius: 99px; background: linear-gradient(90deg, #E4C27E, var(--gold, #C7A56C) 55%, #B98B57); color: var(--ink); font-weight: 800; font-size: 17px; box-shadow: 0 14px 28px -12px rgba(160,120,60,.55); transition: transform .18s, box-shadow .2s, filter .2s; }
  .hk-checkout svg { width: 20px; height: 20px; }
  .hk-checkout:hover { filter: brightness(1.04); box-shadow: 0 18px 32px -12px rgba(160,120,60,.6); }
  .hk-checkout:active { transform: scale(.98); }
  .hk-secure { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: var(--ink-soft); margin: 12px 0 0; }
  .hk-secure svg { width: 14px; height: 14px; }
  .hk-note { margin: 14px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--ivory, #F7F1E8); font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  [dir="rtl"] .cart-item.leaving { transform: translateX(16px) scale(.98); }
</style>

<div id="hk-top"></div>
<main id="main" tabindex="-1">

<div class="wrap page-head">
  <a class="keep-browsing" href="stories.html" data-i18n="cart.keep_browsing">← Keep browsing</a>
  <div class="head-row"><h1 data-i18n="cart.title">Your Cart</h1>

    <div id="upsell-banner-slot"></div>

  </div>

</main>

<script defer>
  const t = (key, fallback) => {
    try { const val = window.hikayaT && window.hikayaT(key); return val || fallback || key; }
    catch { return fallback || key; }
  };
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PROMO_KEY = 'hikaya_promo';
  const IC = {
    gift: '<svg viewBox="0 0 24 24" stroke-width="1.6"><rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-1.5-3-5-3.6-5-1.4C7 8 9.5 8 12 8zm0 0c1.5-3 5-3.6 5-1.4C17 8 14.5 8 12 8z"/></svg>',
    spark: '<svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></svg>',
    heart: '<svg viewBox="0 0 24 24" stroke-width="1.7"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>',
    shield: '<svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
    truck: '<svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M2 6h11v10H2zM13 9h4.5L21 12.5V16h-8"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
    tag: '<svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>',
    plus: '<svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
    lock: '<svg viewBox="0 0 24 24" stroke-width="1.7"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>',
  };

  let appliedPromo = null;
  try { appliedPromo = JSON.parse(localStorage.getItem(PROMO_KEY)) || null; } catch { appliedPromo = null; }

  document.addEventListener('DOMContentLoaded', () => {
    render();
    document.addEventListener('hikaya:regionchange', render);
    document.addEventListener('hikaya:langchange', render);
  });

  function fmt(n, region) {
    return window.hikayaFormatPrice ? window.hikayaFormatPrice(n, region) : `${region.symbol} ${n}`;
  }
  /* "~AED 34" style rounding for the nudge (whole units for AED/SAR/QAR, 2 decimals otherwise). */
  function fmtApprox(n, region) {
    const whole = ['AED', 'SAR', 'QAR'].includes(region.currency);
    return '~' + fmt(whole ? Math.round(n) : Math.round(n * 4) / 4, region);
  }
  function etaRange() {
    const k = window.hikayaRegionKey ? window.hikayaRegionKey() : 'UAE';
    return (k === 'UAE' || k === 'Saudi') ? '4–6' : '6–8';
  }

  /* Same maths as checkout (server re-checks everything at payment). */
  function priceWithPromo(pricing) {
    let deliveryFee = pricing.tier.freeDelivery ? 0 : pricing.deliveryFee;
    let booksTotal = pricing.booksTotal, promoOff = 0;
    if (appliedPromo) {
      if (appliedPromo.type === 'free_shipping') { promoOff = deliveryFee; deliveryFee = 0; }
      else if (appliedPromo.type === 'percent') { promoOff = booksTotal * (appliedPromo.value / 100); booksTotal -= promoOff; }
      else if (appliedPromo.type === 'fixed') { promoOff = Math.min(booksTotal, appliedPromo.value); booksTotal -= promoOff; }
    }
    return { deliveryFee, booksTotal, promoOff, total: booksTotal + deliveryFee + (pricing.extraCharacterFee || 0) };
  }

  function progressHtml(count, region) {
    const tiers = window.HIKAYA_BUNDLE_TIERS || [];
    const t2 = tiers.find(x => x.minItems === 2) || { discountPct: 10 };
    const t3 = tiers[tiers.length - 1] || { discountPct: 15 };
    if (count >= t3.minItems) {
      const p = window.hikayaCart.computeCartPricing(region);
      const saved = p.perBookFull * count - p.booksTotal + (region.deliveryFee || 0);
      return `<div class="hk-progress maxed">
        <span class="hk-progress-ic">${IC.spark}</span>
        <div><h2>${t('cart.max_title', 'Yay! Max bundle savings unlocked')} 🎉</h2>
        <p>${t('cart.max_sub', "You're saving {amount} on this order").replace('{amount}', `<bdi>${fmt(saved, region)}</bdi>`)}</p></div>
      </div>`;
    }
    const next = count + 1;
    const nextTier = count === 1 ? t2 : t3;
    const currentlyPaysDelivery = count === 1 && region.deliveryFee > 0;
    const saving = region.bookNow * next * (nextTier.discountPct / 100) + (currentlyPaysDelivery ? region.deliveryFee : 0);
    const sub = currentlyPaysDelivery
      ? t('cart.unlock_pct_ship', 'Unlock {pct}% off your whole bundle + free delivery')
      : t('cart.unlock_pct', 'Unlock {pct}% off your whole bundle');
    const fill = Math.round((count / 3) * 100);
    return `<div class="hk-progress">
      <span class="hk-progress-ic">${IC.gift}</span>
      <div class="hk-progress-body">
        <h2>${t('cart.add_one_save', 'Add 1 more book & save')} <em><bdi>${fmtApprox(saving, region)}</bdi></em></h2>
        <p>${sub.replace('{pct}', nextTier.discountPct)}</p>
        <div class="hk-bar" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${count}"><span style="width:${fill}%"></span></div>
        <div class="hk-bar-labels"><span class="${count >= 2 ? 'on' : ''}">${t('cart.tier2_label', '2 books · {pct}%').replace('{pct}', t2.discountPct)}</span><span>${t('cart.tier3_label', '3+ books · {pct}%').replace('{pct}', t3.discountPct)}</span></div>
      </div>
    </div>`;
  }

  function render() {
    if (!window.hikayaCart || !window.hikayaRegion) return;
    const cart = window.hikayaCart.getCart();
    const region = window.hikayaRegion();
    const itemsWrap = document.getElementById('cart-items');
    const summarySlot = document.getElementById('summary-slot');
    const upsellSlot = document.getElementById('upsell-banner-slot');
    const countSub = document.getElementById('cart-count-sub');
    const extras = document.getElementById('cart-extras');

    countSub.textContent = cart.length === 0 ? '' : t('cart.ready_count', '{n} {books} ready to sparkle ✨').replace('{n}', cart.length).replace('{books}', cart.length === 1 ? t('cart.book_singular', 'book') : t('cart.book_plural', 'books'));

    if (cart.length === 0) {
      itemsWrap.innerHTML = `
        <div class="empty-cart">
          <svg viewBox="0 0 24 24" stroke-width="1.6"><path d="M3 4h2l2.2 11a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.6L21 8H6.5"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
          <h2>${t('cart.empty_title', 'Your cart is empty')}</h2>
          <p>${t('cart.empty_sub', 'Create a personalized storybook to get started.')}</p>
          <a class="btn-primary" href="stories.html" style="display:inline-flex; width:auto; padding:14px 30px;">${t('cart.browse_stories', 'Browse Stories')}</a>
        </div>`;
      summarySlot.innerHTML = ''; upsellSlot.innerHTML = ''; extras.innerHTML = '';
      return;
    }

    const pricing = window.hikayaCart.computeCartPricing(region);
    const fin = priceWithPromo(pricing);
    const H = window.Hikaya;
    upsellSlot.innerHTML = progressHtml(cart.length, region);

    itemsWrap.innerHTML = cart.map(item => {
      const title = esc(item.story);
      const chips = [
        item.childName ? `<span class="chip name">${IC.heart}${esc(item.childName)}</span>` : '',
        item.ageEdition ? `<span class="chip">${t('cart.ages', 'Ages')} <bdi dir="ltr">${esc(item.ageEdition)}</bdi></span>` : '',
        item.bookLanguage ? `<span class="chip">${item.bookLanguage === 'ar' ? t('cart.lang_ar', 'Arabic book') : t('cart.lang_en', 'English book')}</span>` : '',
        `<span class="chip">${t('cart.hardcover', 'Hardcover')}</span>`,
        item.extraCharacterName ? `<span class="chip extra">+ ${esc(item.extraCharacterName)}</span>` : '',
      ].join('');
      const showWas = region.bookWas > pricing.perBookDiscounted;
      return `
      <div class="cart-item" data-id="${esc(item.id)}" data-clarity-mask="true">
        <div class="cover ${esc(item.theme || '')}" data-item-id="${esc(item.id)}"></div>
        <div class="info">
          <h3>${title}</h3>
          <div class="chips">${chips}</div>
        </div>
        <div class="price-col">
          <div class="price">${showWas ? `<s class="hk-was"><bdi>${fmt(region.bookWas, region)}</bdi></s>` : ''}<bdi>${fmt(pricing.perBookDiscounted, region)}</bdi></div>
          <button type="button" class="remove-btn" data-id="${esc(item.id)}" aria-label="${t('cart.remove', 'Remove')}" title="${t('cart.remove', 'Remove')}">${IC.trash}</button>
        </div>
      </div>`;
    }).join('');

    if (window.hikayaCart.paintCovers) window.hikayaCart.paintCovers(itemsWrap, '.cover[data-item-id]');
    itemsWrap.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.cart-item');
        row.classList.add('leaving');
        setTimeout(() => { window.hikayaCart.removeFromCart(btn.dataset.id); render(); document.dispatchEvent(new CustomEvent('hikaya:cartchange')); }, 260);
      });
    });

    const tiers = window.HIKAYA_BUNDLE_TIERS || [];
    const nextTier = tiers.find(x => x.minItems === cart.length + 1);
    extras.innerHTML = `
      <a class="hk-add-more" href="stories.html">${IC.plus}<span>${nextTier
        ? t('cart.add_another_save', 'Add another book — save {pct}%').replace('{pct}', nextTier.discountPct) + ' 🎁'
        : t('cart.add_another', 'Add another magical book')}</span></a>
      <div class="hk-trust">
        <div>${IC.shield}<span>${t('cart.trust_secure', 'Secure checkout')}</span></div>
        <div>${IC.truck}<span>${t('cart.trust_delivery', 'Delivered in {range} working days').replace('{range}', `<bdi dir="ltr">${etaRange()}</bdi>`)}</span></div>
        <div>${IC.heart}<span>${t('cart.trust_love', 'Made with love')}</span></div>
      </div>`;

    const bundleOff = pricing.perBookFull * pricing.itemCount - pricing.booksTotal;
    const deliveryWaived = pricing.tier.freeDelivery && region.deliveryFee > 0 ? region.deliveryFee : 0;
    const saving = bundleOff + deliveryWaived + fin.promoOff;
    const promoLabel = appliedPromo
      ? (appliedPromo.type === 'free_shipping' ? t('cart.promo_freeship', 'Free delivery') : `-${appliedPromo.type === 'percent' ? appliedPromo.value + '%' : fmt(appliedPromo.value, region)}`)
      : '';

    summarySlot.innerHTML = `
      <div class="summary-box">
        <h3>${IC.spark}<span>${t('cart.order_summary', 'Order summary')}</span></h3>
        <div class="srow"><span>${t('cart.subtotal_n', 'Subtotal ({n} {books})').replace('{n}', pricing.itemCount).replace('{books}', pricing.itemCount === 1 ? t('cart.book_singular', 'book') : t('cart.book_plural', 'books'))}</span><bdi>${fmt(pricing.perBookFull * pricing.itemCount, region)}</bdi></div>
        ${pricing.tier.discountPct > 0 ? `<div class="srow gold"><span>${t('cart.bundle_pct_off', 'Bundle {pct}% off').replace('{pct}', pricing.tier.discountPct)}</span><bdi>−${fmt(bundleOff, region)}</bdi></div>` : ''}
        ${pricing.extraCharacterFee > 0 ? `<div class="srow"><span>${t('cart.extra_character_fee', 'Extra character photo')}</span><bdi>${fmt(pricing.extraCharacterFee, region)}</bdi></div>` : ''}
        ${appliedPromo && fin.promoOff > 0 ? `<div class="srow gold"><span>${t('cart.promo_row', 'Promo')} · ${esc(appliedPromo.code)}</span><bdi>−${fmt(fin.promoOff, region)}</bdi></div>` : ''}
        <div class="srow gold"><span>${t('cart.shipping', 'Shipping')}</span>${fin.deliveryFee === 0 ? `<b>${t('cart.free_caps', 'FREE')}</b>` : `<bdi>${fmt(fin.deliveryFee, region)}</bdi>`}</div>
        <div class="srow total"><span>${t('cart.total', 'Total')}</span><bdi>${fmt(fin.total, region)}</bdi></div>
        ${saving > 0.004 ? `<div class="hk-saving">${IC.tag}<span>${t('cart.saving', "You're saving {amount}").replace('{amount}', `<bdi>${fmt(saving, region)}</bdi>`)} 🎉</span></div>` : ''}
        ${appliedPromo
          ? `<div class="hk-promo applied">${IC.tag}<span><b>${esc(appliedPromo.code)}</b> ${promoLabel}</span><button type="button" id="promo-remove">${t('cart.promo_remove', 'Remove')}</button></div>`
          : `<details class="hk-promo" id="promo-box"><summary>${IC.tag}<span>${t('cart.promo_q', 'Have a promo code?')}</span></summary>
              <div class="hk-promo-form"><input type="text" id="promo-input" autocomplete="off" autocapitalize="characters" placeholder="${t('checkout.promo_placeholder', 'Discount code')}" /><button type="button" id="promo-apply">${t('checkout.apply', 'Apply')}</button></div>
              <p class="hk-promo-msg" id="promo-msg" role="status"></p></details>`}
        <a class="hk-checkout" href="checkout.html">${IC.spark}<span>${t('cart.checkout_total', 'Checkout · {total}').replace('{total}', `<bdi>${fmt(fin.total, region)}</bdi>`)}</span></a>
        <p class="hk-secure">${IC.lock}${t('cart.secure_line', 'Secure payment · Encrypted')}</p>
        <p class="hk-note">${t('cart.made_note', 'Every book is printed to order, gift-wrapped and delivered to your door')}</p>
        <a class="continue-shopping" href="stories.html">${t('cart.continue_shopping', '← Continue Shopping')}</a>
      </div>`;
    bindPromo(region);
  }

  function bindPromo() {
    const rm = document.getElementById('promo-remove');
    if (rm) rm.addEventListener('click', () => { appliedPromo = null; try { localStorage.removeItem(PROMO_KEY); } catch {} render(); });
    const btn = document.getElementById('promo-apply');
    if (!btn) return;
    const input = document.getElementById('promo-input');
    const msg = document.getElementById('promo-msg');
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } });
    btn.addEventListener('click', async () => {
      const code = input.value.trim();
      if (!code) return;
      msg.className = 'hk-promo-msg'; msg.textContent = t('checkout.promo_checking', 'Checking…'); btn.disabled = true;
      try {
        const res = await fetch('/.netlify/functions/validate-discount-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
        const data = await res.json();
        if (!res.ok || !data.valid) {
          msg.className = 'hk-promo-msg error'; msg.textContent = data.error || t('checkout.promo_invalid', "That code isn't valid."); btn.disabled = false; return;
        }
        appliedPromo = { code: code.toUpperCase(), type: data.type, value: data.value };
        try { localStorage.setItem(PROMO_KEY, JSON.stringify(appliedPromo)); } catch {}
        render();
      } catch {
        msg.className = 'hk-promo-msg error'; msg.textContent = t('checkout.err_generic', 'Something went wrong. Please try again.'); btn.disabled = false;
      }
    });
  }
</script>

<script src="/home6-i18n.js" defer></script>
<script src="/pages-i18n.js" defer></script>
<script src="/site-photos.js" defer></script>
<script src="chrome.js" defer></script>
<script>
/* Cart: "Add another story for a sibling?" — links into the normal personalise flow (bundle pricing applies as usual). */
document.addEventListener('DOMContentLoaded', async function () {
  var H = window.Hikaya; if (!H) return;
  async function render() {
    var cart = (window.hikayaCart && window.hikayaCart.getCart) ? window.hikayaCart.getCart() : JSON.parse(localStorage.getItem('hikaya_cart_v1') || '[]');
    var sec = document.getElementById('sibling'); if (!cart.length) { sec.hidden = true; return; }
    var inCart = cart.map(function (i) { return i.story; });
    var all = await H.loadCatalog();
    var list = all.filter(function (s) { return inCart.indexOf(s.title) < 0; }).slice(0, 3);
    document.getElementById('sib-list').innerHTML = list.map(function (s) {
      return '<li><a href="' + H.esc(H.storyHref(s)) + '">' + H.coverHtml(s) + '<span><b>' + H.titleHtml(s) + '</b><small>' + H.esc(H.ageText(s.age_bands)) + '</small></span></a></li>';
    }).join('');
    sec.hidden = !list.length;
  }
  render(); document.addEventListener('hikaya:langchange', render); document.addEventListener('hikaya:cartchange', render);
});
</script>

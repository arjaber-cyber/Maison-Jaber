<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Your Order — Hikaya by Maison Jaber</title>
<meta name="description" content="Check the status of your Hikaya storybook order." />
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/png" href="images/favicon-star.png" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --ink: #2E2018; --ink-soft: #7d6a5a; --line: #DFC9AE; --line-soft: #ece1d1;
    --coral: #A67443; --coral-deep: #563622; --bg: #F8F2E8; --bg-soft: #F3E8D8; --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; }
  h1, h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; margin: 0; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; }

  header.site { border-bottom: 1px solid var(--line-soft); }
  header.site .inner { max-width: 1180px; margin: 0 auto; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
  .site-logo { height: 56px; }
  header.site nav a { font-size: 13px; font-weight: 700; color: var(--ink-soft); }

  .page-head { padding: 44px 0 8px; text-align: center; }
  .page-head h1 { font-size: 28px; }
  .page-head p { color: var(--ink-soft); font-weight: 600; font-size: 14px; margin-top: 8px; }

  .lookup-card { background: #fff; border-radius: var(--radius); padding: 28px; margin: 28px 0; }
  .field-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 6px; display: block; }
  .field { margin-bottom: 16px; }
  .field input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line-soft); font-size: 14px;
    font-family: 'Inter', sans-serif; box-sizing: border-box;
  }
  .field input:focus { outline: none; border-color: var(--coral); }
  .btn-primary {
    width: 100%; padding: 14px; border-radius: 999px; border: none; background: var(--coral); color: #fff;
    font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
  .btn-primary:hover { background: var(--coral-deep); }
  .lookup-error { color: var(--coral-deep); font-size: 13px; font-weight: 700; margin-top: 12px; text-align: center; display: none; }

  .result-card { background: #fff; border-radius: var(--radius); padding: 28px; margin-bottom: 40px; display: none; }
  .result-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .result-header h2 { font-size: 19px; }
  .result-header span { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .result-items { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 22px; }

  .timeline { display: flex; flex-direction: column; gap: 0; }
  .tl-step { display: flex; gap: 14px; }
  .tl-step .marker-col { display: flex; flex-direction: column; align-items: center; }
  .tl-step .marker { width: 22px; height: 22px; border-radius: 50%; background: var(--line-soft); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .tl-step .marker svg { width: 12px; height: 12px; stroke: #fff; fill: none; display: none; }
  .tl-step.done .marker, .tl-step.current .marker { background: var(--coral); }
  .tl-step.done .marker svg { display: block; }
  .tl-step .bar { width: 2px; flex: 1; background: var(--line-soft); min-height: 22px; }
  .tl-step.done .bar { background: var(--coral); }
  .tl-step:last-child .bar { display: none; }
  .tl-step .label { padding-bottom: 24px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); padding-top: 2px; }
  .tl-step.current .label { color: var(--ink); }
  .invoice-link { display: block; text-align: center; margin-top: 4px; font-size: 13px; font-weight: 700; text-decoration: underline; color: var(--ink-soft); }

  footer.site { background: #2E2018; color: #e8ddd0; padding: 30px 0; text-align: center; margin-top: 40px; }
  footer.site p { font-size: 12.5px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hikaya.css" />
</head>
<body data-flow="track">

<div id="hk-top"></div>
<main id="main" tabindex="-1">

<div class="wrap page-head">
  <h1 data-i18n="trk.title">Track Your Order</h1>
  <p data-i18n="trk.intro">Enter your order number and the email you used at checkout.</p>
</div>

<div class="wrap">
  <form class="lookup-card" id="track-form" novalidate>
    <div class="field">
      <label class="field-label" for="order-number" data-i18n="trk.order_label">Order Number</label>
      <input type="text" id="order-number" placeholder="HK-12345678" autocomplete="off" dir="ltr" required />
    </div>
    <div class="field">
      <label class="field-label" for="track-email" data-i18n="trk.email_label">Email</label>
      <input type="email" id="track-email" placeholder="you@email.com" autocomplete="email" dir="ltr" required aria-describedby="lookup-error" />
    </div>
    <button type="submit" class="btn-primary" id="track-btn" data-i18n="trk.action">Track Order</button>
    <div class="lookup-error" id="lookup-error" role="alert" aria-live="assertive"></div>
  </form>

  <div class="result-card" id="result-card" tabindex="-1">
    <div class="result-header">
      <h2 id="result-order-number" dir="ltr"></h2>
      <span id="result-date"></span>
    </div>
    <div class="result-items" id="result-items"></div>
    <div class="timeline" id="timeline"></div>
    <a class="invoice-link" id="invoice-link" href="#" data-i18n="trk.invoice">View Invoice →</a>
  </div>
</div>
</main>
<div id="hk-foot"></div>

<script>
/* QA003: validate before calling the lookup, and always restore the button
   (not found, server error, timeout, network failure, success). */
(function () {
  const tr = (k, fb) => (window.hikayaT && window.hikayaT(k)) || fb;
  const STAGE_FB = {
    received: 'Order Received', preparing: 'Preparing the Book', awaiting_approval: 'Awaiting Final Approval',
    sent_to_printing: 'Sent to Printing', received_from_printing: 'Received from Printing',
    shipped: 'Shipped', delivered: 'Delivered',
  };
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const form = document.getElementById('track-form');
  const btn = document.getElementById('track-btn');
  const numEl = document.getElementById('order-number');
  const emailEl = document.getElementById('track-email');
  const errorEl = document.getElementById('lookup-error');
  const resultCard = document.getElementById('result-card');
  let busy = false, lastData = null, lastEmail = '';

  function setBusy(on) {
    busy = on; btn.disabled = on; btn.setAttribute('aria-busy', String(on));
    btn.textContent = on ? tr('trk.pending', 'Checking…') : tr('trk.action', 'Track Order');
  }
  function showError(msg, field) {
    errorEl.textContent = msg; errorEl.style.display = 'block';
    [numEl, emailEl].forEach(el => el.removeAttribute('aria-invalid'));
    if (field) { field.setAttribute('aria-invalid', 'true'); field.focus(); }
  }
  function clearError() { errorEl.textContent = ''; errorEl.style.display = 'none'; [numEl, emailEl].forEach(el => el.removeAttribute('aria-invalid')); }
  [numEl, emailEl].forEach(el => el.addEventListener('input', clearError));

  function renderResult() {
    const data = lastData; if (!data) return;
    const loc = (window.hikayaLang && window.hikayaLang() === 'ar') ? 'ar-AE' : 'en-GB';
    document.getElementById('result-order-number').textContent = data.orderNumber;
    document.getElementById('result-date').textContent = data.createdAt ? new Date(data.createdAt).toLocaleDateString(loc) : '';
    document.getElementById('result-items').textContent = (data.items || []).map(i => i.childName ? tr('trk.item_for', '{story} for {name}').replace('{story}', i.story).replace('{name}', i.childName) : i.story).join(' · ');
    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '';
    (data.stages || []).forEach((stage, i) => {
      const row = document.createElement('div');
      row.className = 'tl-step ' + (i < data.stageIndex ? 'done' : i === data.stageIndex ? 'current' : '');
      if (i === data.stageIndex) row.setAttribute('aria-current', 'step');
      row.innerHTML = '<div class="marker-col"><div class="marker"><svg viewBox="0 0 24 24" stroke-width="3" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg></div><div class="bar"></div></div><div class="label"></div>';
      row.querySelector('.label').textContent = tr('trk.st_' + stage, STAGE_FB[stage] || stage);
      timeline.appendChild(row);
    });
    document.getElementById('invoice-link').href = `invoice.html?orderNumber=${encodeURIComponent(data.orderNumber)}&email=${encodeURIComponent(lastEmail)}`;
  }

  async function trackOrder() {
    if (busy) return;
    clearError();
    resultCard.style.display = 'none';
    const orderNumber = numEl.value.trim();
    const email = emailEl.value.trim();
    if (!orderNumber) return showError(tr('trk.err_order', 'Please enter your order number.'), numEl);
    if (!email) return showError(tr('trk.err_email_missing', 'Please enter the email you used at checkout.'), emailEl);
    if (!EMAIL_RE.test(email)) return showError(tr('trk.err_email', 'Please enter a valid email address, like name@example.com.'), emailEl);

    setBusy(true);
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    const timer = ctrl ? setTimeout(() => ctrl.abort(), 15000) : null;
    try {
      const res = await fetch('/.netlify/functions/track-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderNumber, email }),
        signal: ctrl ? ctrl.signal : undefined,
      });
      let data = {};
      try { data = await res.json(); } catch (_) { data = {}; }
      if (res.status === 404 || (res.ok && !data.orderNumber)) {
        showError(tr('trk.not_found', 'We could not find that order. Double-check your order number and email, then try again.'));
        return;
      }
      if (!res.ok) { showError(tr('trk.err_generic', 'Something went wrong. Please try again.')); return; }
      lastData = data; lastEmail = email;
      renderResult();
      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      resultCard.focus({ preventScroll: true });
    } catch (err) {
      showError(err && err.name === 'AbortError'
        ? tr('trk.err_timeout', 'This is taking longer than usual. Please try again.')
        : tr('trk.err_generic', 'Something went wrong. Please try again.'));
    } finally {
      if (timer) clearTimeout(timer);
      setBusy(false);
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); trackOrder(); });
  document.addEventListener('hikaya:langchange', () => { if (!busy) setBusy(false); if (lastData) renderResult(); });
})();
</script>

<script src="/i18n.js" defer></script>
<script src="/home6-i18n.js" defer></script>
<script src="/pages-i18n.js" defer></script>
<script src="/site-photos.js" defer></script>
<script src="/consent.js" defer></script>
<script src="/analytics.js" defer></script>
<script src="/region.js" defer></script>
<script src="/cart.js" defer></script>
<script src="chrome.js" defer></script>
</body>
</html>

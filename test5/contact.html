<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Contact | Hikaya</title>
<meta name="description" content="Questions about an order, a photo or delivery? Get in touch with Hikaya." />
<link rel="icon" type="image/png" href="images/favicon-star.png" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hikaya.css" />
</head>
<body data-page="contact">
<div id="hk-top"></div>
<main id="main">

<div class="wrap contact-grid">
  <section aria-labelledby="ct-title">
    <h1 id="ct-title" data-i18n="pg.ct_title">Get in touch</h1>
    <p class="lede" data-i18n="pg.ct_sub"></p>
    <form class="cform" id="cform" novalidate>
      <label><span data-i18n="pg.ct_name">Name</span><input type="text" id="contact-name" autocomplete="name" required /></label>
      <label><span data-i18n="pg.ct_email">Email</span><input type="email" id="contact-email" autocomplete="email" required /></label>
      <label><span data-i18n="pg.ct_order">Order number (optional)</span><input type="text" id="contact-order" placeholder="HK-12345678" /></label>
      <label><span data-i18n="pg.ct_message">Message</span><textarea id="contact-message" rows="6" required></textarea></label>
      <button type="submit" class="btn btn-primary" id="contact-submit" data-i18n="pg.ct_send">Send Message</button>
      <p class="form-msg" id="contact-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
  <aside class="reach" aria-labelledby="reach-title">
    <h2 id="reach-title" data-i18n="pg.ct_other">Other ways to reach us</h2>
    <dl>
      <div><dt data-i18n="pg.ct_email_l">Email</dt><dd><a href="mailto:hello@maison-jaber.com">hello@maison-jaber.com</a></dd></div>
      <div><dt data-i18n="pg.ct_resp">Response time</dt><dd data-i18n="pg.ct_resp_v">Usually within a day</dd></div>
      <div><dt data-i18n="pg.ct_based">Based in</dt><dd data-i18n="pg.ct_based_v">United Arab Emirates</dd></div>
    </dl>
    <p class="note"><span data-i18n="pg.ct_track">Checking on an order?</span> <a href="track-order.html" data-i18n="pg.ct_track_a">Track your order</a></p>
  </aside>
</div>
<script>
/* Same contact-submit logic as before, now with EN/AR messages. */
document.addEventListener('DOMContentLoaded', function () {
  var t = function (k, f) { return (window.hikayaT && window.hikayaT(k)) || f; };
  document.getElementById('cform').addEventListener('submit', async function (e) {
    e.preventDefault();
    var name = document.getElementById('contact-name').value.trim(), email = document.getElementById('contact-email').value.trim();
    var orderNumber = document.getElementById('contact-order').value.trim(), message = document.getElementById('contact-message').value.trim();
    var msg = document.getElementById('contact-msg'), btn = document.getElementById('contact-submit');
    msg.className = 'form-msg';
    if (!name || !email || message.length < 5) { msg.className = 'form-msg error'; msg.textContent = t('pg.ct_missing', 'Please fill in your name, email and a short message.'); return; }
    btn.disabled = true; btn.textContent = t('pg.ct_sending', 'Sending…');
    try {
      var res = await fetch('/.netlify/functions/contact-submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, email: email, orderNumber: orderNumber, message: message }) });
      var data = await res.json();
      if (res.ok) { msg.className = 'form-msg success'; msg.textContent = t('pg.ct_ok', "Thanks! We'll get back to you soon."); document.getElementById('cform').reset(); }
      else { msg.className = 'form-msg error'; msg.textContent = data.error || t('pg.ct_err', 'Something went wrong. Please try again.'); }
    } catch (_) { msg.className = 'form-msg error'; msg.textContent = t('pg.ct_err', 'Something went wrong. Please try again.'); }
    btn.disabled = false; btn.textContent = t('pg.ct_send', 'Send Message');
  });
});
</script>
</main>
<div id="hk-foot"></div>
<script src="/i18n.js" defer></script>
<script src="/home6-i18n.js" defer></script>
<script src="/pages-i18n.js" defer></script>
<script src="/site-photos.js" defer></script>
<script src="/consent.js" defer></script>
<script src="/analytics.js" defer></script>
<script src="/region.js" defer></script>
<script src="/cart.js" defer></script>
<script src="chrome.js" defer></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta name="facebook-domain-verification" content="z0dsslwsf1nitulb8k7biwj8d4o897" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hikaya by Maison Jaber</title>
<meta name="description" content="Hikaya by Maison Jaber — personalised storybooks with your child as the hero." />
<link rel="icon" href="hikaya/images/logo-hikaya.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --ivory: #F7F1E8; --ink: #261C17; --ink-soft: #5E4A3D; --brand: #8A5638; --brand-dark: #573624; --gold: #C7A56C; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ivory); color: var(--ink);
    font-family: 'Manrope', 'Helvetica Neue', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100svh; padding: 24px 16px; box-sizing: border-box;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 36px; }
  .logo { display: block; }
  .logo img { width: min(340px, 72vw); height: auto; display: block; }
  .enter {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--brand); color: var(--ivory); text-decoration: none;
    font-weight: 700; font-size: 17px; letter-spacing: .04em;
    padding: 15px 44px; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(87, 54, 36, .18);
    transition: background .2s, transform .2s;
  }
  .enter:hover, .enter:focus-visible { background: var(--brand-dark); transform: translateY(-1px); }
  .enter:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .enter span[aria-hidden] { transition: transform .2s; }
  .enter:hover span[aria-hidden] { transform: translateX(3px); }
</style>
</head>
<body>
  <main class="wrap">
    <a class="logo" href="/hikaya/" aria-label="Enter Hikaya by Maison Jaber">
      <img src="hikaya/images/logo-hikaya.webp" width="309" height="240" alt="Hikaya by Maison Jaber" />
    </a>
    <a class="enter" href="/hikaya/">Enter <span aria-hidden="true">→</span></a>
  </main>
<script src="/analytics.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>/* set language before first paint: no English flash for Arabic visitors */(function(){try{if(localStorage.getItem("hikaya_lang")==="ar"){var d=document.documentElement;d.lang="ar";d.dir="rtl";d.className+=" i18n-wait";setTimeout(function(){d.classList.remove("i18n-wait")},2500)}}catch(e){}})();</script>
<style>html.i18n-wait body{visibility:hidden}</style>
<meta name="description" content="Your personalised Hikaya storybook is saved in your cart. Add another child's story or continue to checkout." />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Added to Your Cart — Hikaya by Maison Jaber</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="images/favicon-star.png" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');
  :root {
    --ink: #2E2018; --ink-soft: #7d6a5a; --line: #DFC9AE; --line-soft: #ece1d1;
    --coral: #A67443; --coral-deep: #563622; --bg: #F8F2E8; --bg-soft: #F3E8D8;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.6; min-height: 100vh; }
  h1, h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; margin: 0; }
  a { color: inherit; text-decoration: none; }

  .page {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px; position: relative; overflow: hidden;
  }
  .page-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.16; }
  .page-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, var(--bg) 0%, rgba(248,242,232,0.85) 60%, var(--bg) 100%); }

  .wordmark { position: relative; z-index: 2; margin-bottom: 32px; }
  .wordmark img { height: 64px; }

  .card {
    position: relative; z-index: 2; background: #fff; border-radius: var(--radius); padding: 44px 40px;
    max-width: 480px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(70,45,25,0.12);
  }

  .check-ring {
    width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(160deg, #D98868, var(--coral-deep));
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
    box-shadow: 0 10px 26px rgba(86,54,34,0.25);
  }
  .check-ring svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 2.5; }

  .script-note { font-family: 'Caveat', cursive; font-size: 22px; color: var(--coral-deep); margin-bottom: 4px; display: block; }
  h1 { font-size: 30px; margin-bottom: 10px; }
  .sub { font-size: 15px; color: var(--ink-soft); margin-bottom: 28px; max-width: 36ch; margin-left: auto; margin-right: auto; }

  .item-chip {
    display: flex; align-items: center; gap: 14px; background: var(--bg-soft); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 28px; text-align: left;
  }
  .item-chip .swatch { width: 64px; height: 64px; border-radius: 10px; flex-shrink: 0; overflow: hidden; background: linear-gradient(160deg, #f0c9a0, #B5563B); }
  .cross-sell-card .thumb.has-cover { padding: 0; aspect-ratio: 1 / 1; overflow: hidden; }
  .item-chip .swatch.courage { background: linear-gradient(160deg, #f0c9a0, #B5563B); }
  .item-chip .swatch.adventure { background: linear-gradient(160deg, #e8d5a8, #C08A3E); }
  .item-chip .swatch.lullaby { background: linear-gradient(160deg, #d8bdd0, #7d5a6b); }
  .item-chip .name { font-weight: 800; font-size: 15px; }
  .item-chip .meta { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }

  .cart-count { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 22px; }
  .cart-count strong { color: var(--coral-deep); }

  .btn-secondary {
    display: block; width: 100%; padding: 15px; border-radius: 999px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); font-size: 14.5px; font-weight: 700; cursor: pointer; margin-bottom: 12px;
  }
  .btn-secondary:hover { border-color: var(--coral); background: var(--bg-soft); }
  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px;
    border-radius: 999px; border: none; background: var(--coral); color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; box-shadow: 0 12px 28px rgba(70,45,25,0.18);
  }
  .btn-primary:hover { background: var(--coral-deep); }

  .back-link { position: relative; z-index: 2; margin-top: 24px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .back-link:hover { color: var(--coral-deep); }

  .cross-sell { position: relative; z-index: 2; margin-top: 40px; width: 100%; max-width: 480px; text-align: center; }
  .cross-sell-title { font-family: 'Cormorant Garamond', serif; font-size: 19px; margin-bottom: 14px; }
  .cross-sell-grid { display: flex; gap: 12px; justify-content: center; }
  .cross-sell-card {
    background: #fff; border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; width: 140px;
    box-shadow: 0 8px 22px rgba(70,45,25,0.1); transition: transform 0.2s ease;
  }
  .cross-sell-card:hover { transform: translateY(-3px); }
  .cross-sell-card .thumb { aspect-ratio: 4/3.4; display: flex; align-items: center; justify-content: center; padding: 10px; text-align: center; }
  .cross-sell-card .thumb.courage { background: linear-gradient(160deg, #f0c9a0, #B5563B); }
  .cross-sell-card .thumb.adventure { background: linear-gradient(160deg, #e8d5a8, #C08A3E); }
  .cross-sell-card .thumb.lullaby { background: linear-gradient(160deg, #d8bdd0, #7d5a6b); }
  .cross-sell-card .thumb span { color: #fff; font-size: 12.5px; font-weight: 700; line-height: 1.25; }
  .cross-sell-card .label { padding: 8px 10px; font-size: 12px; font-weight: 700; }
  /* Compact layout (22 Oct 2026): everything important fits on one screen, no scrolling */
  body[data-flow="added"] .page { min-height: 0; justify-content: flex-start; padding: clamp(20px, 4vh, 40px) 16px 40px; }
  body[data-flow="added"] .card { max-width: 560px; padding: 26px 28px; text-align: start; }
  .added-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  body[data-flow="added"] .check-ring { width: 48px; height: 48px; margin: 0; flex-shrink: 0; }
  body[data-flow="added"] .check-ring svg { width: 22px; height: 22px; }
  body[data-flow="added"] .script-note { font-size: 19px; margin: 0; line-height: 1.1; }
  body[data-flow="added"] .card h1 { font-size: clamp(26px, 3.2vw, 32px); line-height: 1.1; margin: 0; }
  body[data-flow="added"] .item-chip { margin-bottom: 18px; padding: 12px; text-align: start; }
  body[data-flow="added"] .item-chip .swatch { width: 84px; height: 84px; }
  body[data-flow="added"] .cart-count { margin: 6px 0 0; font-size: 12.5px; }
  body[data-flow="added"] .cart-count:empty { display: none; }
  .added-actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; }
  .added-actions .btn-secondary, .added-actions .btn-primary { margin: 0; padding: 14px 12px; font-size: 14.5px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .added-links { display: flex; justify-content: center; gap: 10px; margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .added-links a { text-decoration: underline; text-underline-offset: 3px; }
  .added-links a:hover { color: var(--coral-deep); }
  body[data-flow="added"] .cross-sell { margin-top: 26px; max-width: 560px; }
  @media (max-width: 520px) {
    .added-actions { grid-template-columns: 1fr; }
    .added-actions .btn-primary { order: -1; }
    body[data-flow="added"] .card { padding: 20px 18px; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="hikaya.css" />
</head>
<body data-flow="added">
<div id="hk-top"></div>
<main id="main" tabindex="-1">

<div class="page">
  <div class="page-bg" id="page-bg" style="background-image:url('images/giftbox-open-pair.jpg');"></div>

  <div class="card">
    <div class="added-head">
      <div class="check-ring"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></div>
      <div>
        <span class="script-note" id="script-note">Lovely choice ♡</span>
        <h1 data-i18n="personalize.added_to_cart_title">Added to your cart</h1>
      </div>
    </div>

    <div class="item-chip" id="item-chip">
      <div class="swatch" id="item-swatch"></div>
      <div>
        <div class="name" id="item-name">—</div>
        <div class="meta" id="item-meta"></div>
        <div class="cart-count" id="cart-count-note"></div>
      </div>
    </div>

    <div class="added-actions">
      <button type="button" class="btn-secondary" id="add-another-btn" data-i18n="personalize.add_another_btn">+ Add Another Book</button>
      <a class="btn-primary" href="checkout.html" id="checkout-link">Continue to Checkout &rarr;</a>
    </div>
    <div class="added-links">
      <a href="cart.html" id="view-cart-link">View cart</a>
      <span aria-hidden="true">·</span>
      <a href="personalize.html" data-i18n="personalize.back_to_order">Back to edit details</a>
    </div>
  </div>

  <div class="cross-sell" id="cross-sell" style="display:none;">
    <div class="cross-sell-title" id="cross-sell-title">You might also like</div>
    <div class="cross-sell-grid" id="cross-sell-grid"></div>
  </div>
</div>

<script src="/cart.js" defer></script>
<script src="/site-photos.js" defer></script>
<script defer>
  document.addEventListener('DOMContentLoaded', () => {
    const cart = window.hikayaCart ? window.hikayaCart.getCart() : [];
    if (cart.length === 0) {
      window.location.href = 'personalize.html';
      return;
    }
    const last = cart[cart.length - 1];

    const swatch = document.getElementById('item-swatch');
    swatch.className = 'swatch ' + (last.theme || 'courage');
    window.hikayaCart.coverFor(last).then(url => window.hikayaCart.paintCover(swatch, url));
    document.getElementById('item-name').textContent = last.story || 'Your story';
    const tt = (k, f) => { try { return (window.hikayaT && window.hikayaT(k)) || f; } catch (_) { return f; } };
    const setMeta = () => {
      const band = last.ageEdition ? String(last.ageEdition).split('-') : null;
      const ageTxt = band ? tt('a11y.age_range', 'Ages {a}–{b}').replace('{a}', band[0]).replace('{b}', band[1] || band[0]) : null;
      const langTxt = last.bookLanguage === 'ar' ? tt('qa.book_ar', 'Arabic book') : tt('qa.book_en', 'English book');
      document.getElementById('item-meta').textContent = [last.childName, ageTxt, langTxt].filter(Boolean).join(' · ');
    };
    setMeta();
    document.addEventListener('hikaya:langchange', setMeta);
    const setSmall = () => {
      const ar = document.documentElement.lang === 'ar';
      document.getElementById('script-note').textContent = ar ? 'اختيار جميل ♡' : 'Lovely choice ♡';
      document.getElementById('view-cart-link').textContent = ar ? 'عرض السلة' : 'View cart';
      const n = cart.length, cl = document.getElementById('checkout-link');
      cl.textContent = (n > 1 ? tt('personalize.go_to_checkout_n', 'Continue to Checkout ({count})').replace('{count}', n) : tt('personalize.go_to_checkout_btn', 'Continue to Checkout')) + (ar ? ' ←' : ' →');
      document.getElementById('cart-count-note').textContent = n > 1 ? tt('personalize.cart_count_label', 'You have {count} books in your cart.').replace('{count}', n) : '';
    };
    setSmall();
    document.addEventListener('hikaya:langchange', setSmall);
    window.addEventListener('load', setSmall);

    const count = cart.length;
    const countNote = document.getElementById('cart-count-note');
    const checkoutLink = document.getElementById('checkout-link');

    document.getElementById('add-another-btn').addEventListener('click', () => {
      window.location.href = 'personalize.html?new=1';
    });

    // Cross-sell: stories from the live catalogue that aren't already in the cart (with their real covers).
    Promise.all([window.hikayaCart.loadStories(), Promise.all(cart.map(i => window.hikayaCart.storyFor(i)))]).then(([all, cartStories]) => {
      // Match by slug so a story that was renamed since it was added still counts as "in the cart".
      const inCart = new Set(cart.map(i => i.slug).concat(cartStories.map(s => s && s.slug)).filter(Boolean));
      const inCartTitles = new Set(cart.map(i => i.story));
      const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const nameOf = s => (window.Hikaya ? window.Hikaya.titlePlain(s) : s.title);
      const suggestions = all.filter(s => s.active !== false && !inCart.has(s.slug) && !inCartTitles.has(s.title)).slice(0, 3);
      if (!suggestions.length) return;
      document.getElementById('cross-sell').style.display = 'block';
      const grid = document.getElementById('cross-sell-grid');
      grid.innerHTML = suggestions.map(s => `
        <a class="cross-sell-card" href="personalize.html?story=${encodeURIComponent(s.slug)}">
          <div class="thumb ${esc(s.theme || 'courage')}" data-cover="${esc(s.cover_image_url || '')}"><span>${esc(nameOf(s))}</span></div>
          <div class="label">${esc(nameOf(s))}</div>
        </a>
      `).join('');
      grid.querySelectorAll('.thumb[data-cover]').forEach(el => { if (el.dataset.cover) window.hikayaCart.paintCover(el, el.dataset.cover); });
    });
  });
</script>

</main>
<div id="hk-foot"></div>
<script src="/i18n.js" defer></script>
<script src="/home6-i18n.js" defer></script>
<script src="/pages-i18n.js" defer></script>
<script src="/consent.js" defer></script>
<script src="/analytics.js" defer></script>
<script src="/region.js" defer></script>
<script src="chrome.js" defer></script>
</body>
</html>
